# ---- Kernel / C library ----
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_REBOOT=y
CONFIG_CRC=y

# ---- Persistent storage: ivshmem (host file mapped as memory) ----
CONFIG_VIRTUALIZATION=y
CONFIG_IVSHMEM=y
CONFIG_IVSHMEM_LOG_LEVEL_WRN=y

# ---- Networking: e1000 Ethernet + QEMU user mode (SLIRP) ----
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
# File descriptors: ctrl listener + 4 ctrl clients + WebSocket + DNS + spare
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_ZVFS_POLL_MAX=8
CONFIG_NET_MAX_CONN=12
CONFIG_NET_MAX_CONTEXTS=14
CONFIG_NET_L2_ETHERNET=y
CONFIG_PCIE=y
# QEMU network = user mode (SLIRP). Without this choice Zephyr defaults to SLIP
# on the 2nd UART, whose driver blocks the boot. scripts/run_qemu.sh starts QEMU itself
# with the same -nic user option; the EXTRA_ARGS below are only for "west build -t run".
CONFIG_NET_QEMU_USER=y
CONFIG_NET_QEMU_USER_EXTRA_ARGS="hostfwd=tcp:127.0.0.1:7000-:7000"
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
# Static IP. Zephyr's e1000 driver does not accept broadcast frames (no RCTL_BAM),
# so DHCP cannot work. src/net/link.c announces us to SLIRP instead. See DECISIONS D7.
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="10.0.2.3"
# QEMU board has no hardware RNG. Only used for the WebSocket mask key.
CONFIG_TEST_RANDOM_GENERATOR=y

# ---- WebSocket client (OCPP-J transport) ----
CONFIG_HTTP_CLIENT=y
CONFIG_WEBSOCKET_CLIENT=y

# ---- Shell on the UART ----
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_SHELL_CMD_BUFF_SIZE=320
CONFIG_SHELL_ARGC_MAX=12

# ---- Logging ----
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_NET_LOG=y
