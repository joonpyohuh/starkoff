# ---- Kernel / C library ----
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_REBOOT=y

# ---- Networking: e1000 Ethernet + QEMU user mode (SLIRP) ----
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_PCIE=y
CONFIG_NET_QEMU_USER=y
CONFIG_NET_QEMU_USER_EXTRA_ARGS="hostfwd=tcp::7000-:7000"
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="10.0.2.3"
# qemu_x86 has no hardware RNG. Only used for the WebSocket mask key.
CONFIG_TEST_RANDOM_GENERATOR=y

# ---- Shell on the UART ----
CONFIG_SHELL=y
CONFIG_NET_SHELL=y

# ---- Logging ----
CONFIG_LOG=y
CONFIG_NET_LOG=y
