# West manifest (T2 "manifest repository" layout).
# This repository is the manifest. `west update` fetches Zephyr v4.2.0 and
# ONLY the modules listed in name-allowlist, so a grader gets the exact same tree.
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.2.0
      import:
        name-allowlist:
          - mbedtls   # websocket client needs SHA1 for the handshake
          - picolibc  # C library (fallback if toolchain copy is not used)
